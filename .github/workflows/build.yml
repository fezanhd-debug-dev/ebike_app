name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Base Project
        run: flutter create --org com.ebike .

      - name: Configure Android Manifest Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="ebike_app"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Set Android MinSdk
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
          fi

      - name: Set compileSdk and targetSdk
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle.kts
          fi

      - name: Enable Core Library Desugaring
        run: |
          python3 << 'PYEOF'
          import re, os

          def patch_groovy(path):
              with open(path) as f:
                  content = f.read()

              if "coreLibraryDesugaringEnabled" not in content:
                  content = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        coreLibraryDesugaringEnabled true',
                      content, count=1
                  )

              if "coreLibraryDesugaring " not in content and 'coreLibraryDesugaring "' not in content:
                  if re.search(r'\bdependencies\s*\{', content):
                      content = re.sub(
                          r'(dependencies\s*\{)',
                          r'\1\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"',
                          content, count=1
                      )
                  else:
                      content += '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n'

              with open(path, "w") as f:
                  f.write(content)

          def patch_kts(path):
              with open(path) as f:
                  content = f.read()

              if "isCoreLibraryDesugaringEnabled" not in content:
                  content = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        isCoreLibraryDesugaringEnabled = true',
                      content, count=1
                  )

              if "coreLibraryDesugaring(" not in content:
                  if re.search(r'\bdependencies\s*\{', content):
                      content = re.sub(
                          r'(dependencies\s*\{)',
                          r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")',
                          content, count=1
                      )
                  else:
                      content += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'

              with open(path, "w") as f:
                  f.write(content)

          gradle_path = "android/app/build.gradle"
          kts_path = "android/app/build.gradle.kts"

          if os.path.exists(gradle_path):
              patch_groovy(gradle_path)
              print("Patched build.gradle")

          if os.path.exists(kts_path):
              patch_kts(kts_path)
              print("Patched build.gradle.kts")
          PYEOF

      - name: Debug - Show Gradle File
        run: |
          echo "===== build.gradle ====="
          cat android/app/build.gradle 2>/dev/null || echo "NOT FOUND"
          echo "===== build.gradle.kts ====="
          cat android/app/build.gradle.kts 2>/dev/null || echo "NOT FOUND"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebike-app-release
          path: build/app/outputs/flutter-apk/app-release.apk              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="ebike_app"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Set Android MinSdk
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
          fi

      - name: Set compileSdk and targetSdk
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle.kts
          fi

      - name: Enable Core Library Desugaring
        run: |
          python3 << 'PYEOF'
          import re, os

          def patch_groovy(path):
              with open(path) as f:
                  content = f.read()

              if "coreLibraryDesugaringEnabled" not in content:
                  content = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        coreLibraryDesugaringEnabled true',
                      content, count=1
                  )

              if "coreLibraryDesugaring " not in content and 'coreLibraryDesugaring "' not in content:
                  if re.search(r'\bdependencies\s*\{', content):
                      content = re.sub(
                          r'(dependencies\s*\{)',
