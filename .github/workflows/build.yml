              if "coreLibraryDesugaring(" not in content:
                  if re.search(r'\bdependencies\s*\{', content):
                      content = re.sub(
                          r'(dependencies\s*\{)',
                          r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")',
                          content, count=1
                      )
                  else:
                      content += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'

              with open(path, "w") as f:
                  f.write(content)

          gradle_path = "android/app/build.gradle"
          kts_path = "android/app/build.gradle.kts"

          if os.path.exists(gradle_path):
