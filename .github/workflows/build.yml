name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Base Project
        run: flutter create --org com.ebike .

      - name: Configure Android Manifest Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="ebike_app"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Set Android MinSdk
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
          fi

      - name: Set compileSdk and targetSdk
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle.kts
          fi

      - name: Enable Core Library Desugaring
        run: |
          KTS="android/app/build.gradle.kts"
          GRADLE="android/app/build.gradle"

          if [ -f "$KTS" ]; then
            if ! grep -q "isCoreLibraryDesugaringEnabled" "$KTS"; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$KTS"
            fi
            if ! grep -q "coreLibraryDesugaring(" "$KTS"; then
              if grep -q "^dependencies {" "$KTS"; then
                sed -i '/^dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' "$KTS"
              else
                cat >> "$KTS" << 'EOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          EOF
              fi
            fi
          fi

          if [ -f "$GRADLE" ]; then
            if ! grep -q "coreLibraryDesugaringEnabled" "$GRADLE"; then
              sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' "$GRADLE"
            fi
            if ! grep -q "coreLibraryDesugaring " "$GRADLE"; then
              if grep -q "^dependencies {" "$GRADLE"; then
                sed -i '/^dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' "$GRADLE"
              else
                cat >> "$GRADLE" << 'EOF'

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
          }
          EOF
              fi
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebike-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
